aid: crossing-minds
name: Crossing Minds
description: >-
  Crossing Minds is an AI personalization and recommendation company. Its B2B
  Recommendation API delivers profile-to-items, session-to-items and
  item-to-items recommendations computed from user ratings and interaction
  events, exposed over a JWT-authenticated REST API with multi-tenant
  organization accounts and isolated per-database datasets. Developers ingest
  users and items (with typed properties) plus ratings and interactions in bulk,
  configure recommendation scenarios, and query real-time recommendations for a
  profile, an anonymous session, or a given item. First-party client SDKs ship
  for Python, Node.js, .NET, Java, Ruby, PHP and browser JavaScript. The team
  joined OpenAI; the API, documentation, SDKs and status page remain online.
